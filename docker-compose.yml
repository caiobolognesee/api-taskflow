
services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_dev
    ports:
      - "5432:5432"
    volumes:
      - taskflow_data:/var/lib/postgresql/data

volumes:
  taskflow_data:
